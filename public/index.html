<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Familia</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f1ea;
    color: #2b2620;
    display: flex;
    justify-content: center;
    padding: 3rem 1.25rem;
  }
  main { width: min(480px, 100%); }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 2rem;
    text-align: center;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.9rem;
  }
  a.app-card {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 1.1rem 1.25rem;
    background: white;
    border: 1px solid #e3ddcf;
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    font-size: 1.05rem;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  a.app-card:hover { border-color: #3a6b52; }
  .emoji { font-size: 1.6rem; }
  .app-card small {
    display: block;
    color: #6b6353;
    font-weight: 400;
    font-size: 0.85rem;
    margin-top: 0.15rem;
  }
</style>
</head>
<body>
  <main>
    <h1>🏠 Familia</h1>
    <ul>
      <li>
        <a class="app-card" href="/cumple-gaia/">
          <span class="emoji">🎉</span>
          <span>
            Cumple de Gaia
            <small>Invitados, gastos y organización</small>
          </span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
