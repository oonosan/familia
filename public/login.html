<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Familia — acceso</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f1ea;
    color: #2b2620;
  }
  main {
    width: min(320px, 90vw);
    text-align: center;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
  }
  input {
    width: 100%;
    font-size: 1.5rem;
    letter-spacing: 0.4em;
    text-align: center;
    padding: 0.75rem;
    border: 1px solid #c9c2b3;
    border-radius: 10px;
    margin-bottom: 1rem;
  }
  button {
    width: 100%;
    font-size: 1.1rem;
    padding: 0.75rem;
    border: none;
    border-radius: 10px;
    background: #3a6b52;
    color: white;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button:disabled { opacity: 0.6; cursor: default; }
  #error {
    color: #b3261e;
    margin-top: 1rem;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <main>
    <h1>🏠 Familia</h1>
    <form id="pin-form" autocomplete="off">
      <input
        id="pin"
        name="pin"
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="8"
        autofocus
        placeholder="••••"
      />
      <button type="submit">Entrar</button>
      <p id="error" hidden>PIN incorrecto, probá de nuevo.</p>
    </form>
  </main>
  <script>
    const form = document.getElementById("pin-form");
    const pinInput = document.getElementById("pin");
    const errorEl = document.getElementById("error");
    const submitBtn = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;
      try {
        const res = await fetch("/.netlify/functions/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: pinInput.value.trim() }),
        });
        if (res.ok) {
          const params = new URLSearchParams(location.search);
          const next = params.get("next");
          location.href = next && next.startsWith("/") ? next : "/";
        } else {
          errorEl.hidden = false;
          pinInput.value = "";
          pinInput.focus();
        }
      } catch {
        errorEl.textContent = "Error de conexión, probá de nuevo.";
        errorEl.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
